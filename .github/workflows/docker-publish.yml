name: Docker Image

on:
  push:
    branches: [master]
    paths:
      - .devcontainer/Dockerfile
      - .github/workflows/docker-publish.yml
  pull_request:
    paths:
      - .devcontainer/Dockerfile
      - .github/workflows/docker-publish.yml
  schedule:
    # 毎月1日 12:00 JST に TeX Live を最新化して再ビルド
    - cron: "0 3 1 * *"
  workflow_dispatch:

env:
  IMAGE: pine318/texlive-ja

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (and push by digest)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          platforms: ${{ matrix.platform }}
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          outputs: ${{ github.event_name == 'pull_request' && 'type=docker' || format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) }}

      - name: Smoke test
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm "${{ steps.build.outputs.imageid }}" sh -c \
            'platex --version | head -1 && uplatex --version | head -1 && lualatex --version | head -1 && latexmk --version && latexindent --version && latexdiff --version'

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          echo "PLATFORM_PAIR=$(echo '${{ matrix.platform }}' | tr / -)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          first="$(ls | head -1)"
          year="$(docker run --rm "${IMAGE}@sha256:${first}" ls /usr/local/texlive | grep -E '^[0-9]{4}$' | sort | tail -1)"
          echo "TeX Live ${year}"
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${year}" \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:latest"
